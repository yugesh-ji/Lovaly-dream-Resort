kind = "web"
previewPath = "/"
title = "Lovaly Dream Resort"
version = "1.0.0"
id = "artifacts/lovaly-resort"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18606

[services.development]
run = "pnpm --filter @workspace/lovaly-resort run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lovaly-resort", "run", "build" ]
run = "pnpm --filter @workspace/lovaly-resort run start"

[services.env]
PORT = "18606"
